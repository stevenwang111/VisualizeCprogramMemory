name: Build cdbg (Windows standalone zip)

on:
  # 本次手动触发
  workflow_dispatch:
  # Pull Request：只跑 Linux 测试，不打包
  pull_request:
  # 之后：每天北京时间凌晨 01:00（UTC 17:00）
  schedule:
    - cron: '0 17 * * *'

permissions:
  contents: write   # 需要写 tag 记录上次构建到的 commit

concurrency:
  group: build-standalone
  cancel-in-progress: false

jobs:
  # 定时触发时，判断自上次成功构建以来仓库是否有新提交；
  # 没有就跳过，避免每天重复构建同一份代码。
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 决定是否需要构建
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          HEAD_SHA="${{ github.sha }}"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "手动触发，直接构建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 读取上次成功构建时打的 tag
          LAST_SHA=$(git ls-remote --tags origin refs/tags/last-built 2>/dev/null | awk '{print $1}' | head -1)
          echo "上次构建 SHA: ${LAST_SHA:-（无）}"
          echo "当前 HEAD  SHA: $HEAD_SHA"
          if [ "$LAST_SHA" = "$HEAD_SHA" ]; then
            echo "没有新的提交，跳过本次定时构建"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "检测到新提交，开始构建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  test-linux:
    name: Linux / Ubuntu x86-64 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gdb python3

      - name: 环境检查
        run: |
          python3 --version
          gcc --version | head -1
          gdb --version | head -1
          gdb --batch --nx -ex "python print(1)"

      - name: 内存布局解析单测
        run: python3 tests/test_memmap_linux.py

      - name: 示例冒烟测试
        run: python3 tests/test_examples.py

      - name: 端到端测试
        run: python3 tests/test_e2e.py

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true' && github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8   # runner 默认 cp1252，中文日志会抛 UnicodeEncodeError
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 安装 Nuitka
        run: python -m pip install --disable-pip-version-check -q nuitka

      - name: 编译并打包（standalone -> zip）
        run: python tools/build_standalone.py --output build_out --msvc

      - name: 上传免安装包
        uses: actions/upload-artifact@v4
        with:
          name: cdbg-windows-x64
          path: build_out/cdbg-windows-x64.zip
          if-no-files-found: error
          retention-days: 90

      - name: 发布 alpha 测试版到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: alpha
          ASSET: build_out/cdbg-windows-x64.zip
          SHA: ${{ needs.check.outputs.head_sha }}
        shell: bash
        run: |
          TITLE="cdbg alpha (测试版) · ${SHA:0:7}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 已有 alpha release：只覆盖资产和标题，不动 changelog（留给用户以后自己填）
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title "$TITLE" --prerelease
            echo "已更新 alpha release 的资产 (${SHA:0:7})"
          else
            gh release create "$TAG" "$ASSET" --title "$TITLE" --notes "" --prerelease
            echo "已创建 alpha release (${SHA:0:7})"
          fi

      - name: 记录本次构建到的 commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          SHA="${{ needs.check.outputs.head_sha }}"
          git tag -f last-built "$SHA"
          git push -f origin refs/tags/last-built
          echo "已把 last-built 指向 $SHA"
